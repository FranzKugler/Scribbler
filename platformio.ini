; PlatformIO Project Configuration File
;
; Scribbler - Seeed XIAO ESP32-S3 Plus
;
; The build produces two images that are updated independently: firmware.bin
; (this code) and littlefs.bin (the Svelte web UI built from web/ into data/).
; The update tab and the release channel both know the difference; see
; src/OtaUpdate.h.

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
    ; Pinned. The release workflow publishes images that devices install, so a
    ; CI build has to reproduce a local one - otherwise the edge channel moves
    ; whenever something upstream does, and a fault seen in the field cannot be
    ; reproduced. Raise these deliberately, then rebuild and check.
    ;
    ; This is the pioarduino fork, not the platform of the same name in the
    ; PlatformIO registry. The registry one carries Arduino core 2.0.x; the
    ; fork carries 3.3.x, which this code needs. Plain `platform =
    ; espressif32` resolves to whichever is installed - locally the fork, on a
    ; clean CI runner the registry version - so it has to be the URL.
    ; Tag 55.03.37 = Arduino core 3.3.7 / ESP-IDF 5.5.2.
    platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
    board = seeed_xiao_esp32s3
    framework = arduino
    board_build.filesystem = littlefs

    ; The board definition targets the 8 MB XIAO ESP32-S3; this is the Plus
    ; variant with 16 MB, so override the flash size and partition table.
    board_upload.flash_size = 16MB
    board_upload.maximum_size = 16777216
    board_build.partitions = partitions.csv

    ; The XIAO has no USB-serial converter: the ESP32-S3's own USB-Serial/JTAG
    ; is the port (VID 303A, PID 1001). Entering the download mode detaches
    ; that USB device and enumerates it again, and the handle esptool already
    ; holds on COMx points nowhere afterwards - "Cannot configure port" and
    ; Windows error 31, which reads like a broken cable and is not one.
    ; `usb-reset` waits for the device to come back; the `default-reset` the
    ; board definition asks for cannot. Written as board_upload rather than as
    ; upload_flags because the builder substitutes it into the middle of the
    ; command line: with esptool 5 `--before` has to come before `write-flash`,
    ; and appended flags land after it, where the option does not exist.
    board_upload.before_reset = usb-reset

    ; Stamps FIRMWARE_VERSION from `git describe --tags`; falls back to the
    ; value in src/Version.h when the working copy has no tags.
    extra_scripts = pre:scripts/version.py

    ; PSRAM on, in octal mode, which is the board definition's own setting and
    ; is left here only to say why it is not to be "simplified" to quad.
    ;
    ; The part is an ESP32-S3R8: esptool reports "Embedded PSRAM 8MB (AP_3v3)",
    ; and 8 MB embedded is always octal - the quad variant of this chip is the
    ; R2 with 2 MB. Building qio_qspi with -DBOARD_HAS_PSRAM therefore boots
    ; into "quad_psram: PSRAM chip is not connected, or wrong PSRAM line mode"
    ; and a LoadProhibited panic loop. That failure is a *mode* mismatch and
    ; not PSRAM as such, which is worth stating because the two look alike from
    ; the far side: turning PSRAM off also makes it stop, and then the wrong
    ; thing gets blamed and carried into the next project. See env:psram_quad
    ; below, which reproduces it on demand.
    ;
    ; What it buys, measured on hardware rather than assumed. The number that
    ; matters is the largest *contiguous internal* block, because that is what
    ; Update.end(true) needs to map and hash a partition, and what an OTA fails
    ; on as "Could Not Activate The Firmware":
    ;
    ;                     at boot      after WiFi is up
    ;   PSRAM off         229 364      163 828
    ;   PSRAM octal       221 172      180 212
    ;
    ; So it costs a little at boot and gives ~16 kB back once the radio is up,
    ; because CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y moves the WiFi and lwIP
    ; buffers out to PSRAM. The 8 MB itself is a bonus nothing here uses yet.
    ;
    ; Safe to change on a device already in the field: PSRAM is brought up by
    ; the application, not the bootloader (CONFIG_SPIRAM_BOOT_HW_INIT is off),
    ; and OTA writes no bootloader. Verified by flashing the previous
    ; no-PSRAM bootloader and then only this firmware over it.
    ;
    ; extra_flags repeats the board's own list because there is no way to add a
    ; single flag to it - the list has to be restated whole.
    board_build.arduino.memory_type = qio_opi
    board_build.extra_flags =
        -DARDUINO_XIAO_ESP32S3
        -DBOARD_HAS_PSRAM
        -DARDUINO_USB_MODE=1
        -DARDUINO_USB_CDC_ON_BOOT=1
        -DARDUINO_RUNNING_CORE=1
        -DARDUINO_EVENT_RUNNING_CORE=1

    build_flags =
        -DCORE_DEBUG_LEVEL=0

    ; Pinned to exact commits. ArduinoJson 7.4.1, RemoteDebug 4.0.1. Full
    ; hashes, not short ones: PlatformIO fetches a git dependency shallowly
    ; (`git fetch --depth=1 origin <ref>`), and a server cannot resolve an
    ; abbreviated hash in that request - "couldn't find remote ref". It only
    ; ever worked where the library was already in the cache.
    ; No WiFiManager: the setup portal is this project's own, so that it can
    ; look like the rest of the web UI rather than merely share its colours -
    ; see src/Portal.h.
    ;
    ; The plotter's two, pinned to exact registry versions:
    ;   Adafruit SSD1306 - the display (src/Display.cpp). Pulls Adafruit GFX
    ;     and BusIO through its own library.json, at the versions it allows;
    ;     pin those here too if a build ever changes under us.
    ;   SparkFun BMI270 - the IMU (src/Imu.cpp). Not optional in practice: it
    ;     carries Bosch's ~8 kB configuration blob, without which the BMI270
    ;     does not measure at all.
    ;   FastAccelStepper - step pulses from the RMT/MCPWM hardware
    ;     (src/Motion.cpp), as in Rotator. 2.x needs Arduino core >= 3.1
    ;     (ESP-IDF >= 5.3); the pinned platform has 3.3.7.
    lib_deps =
        https://github.com/bblanchon/ArduinoJson#32520135092970120a5ac165cf45f48e658c421d
        https://github.com/karol-brejna-i/RemoteDebug#68302f52dc4b691cf3e6ee95f2563f7076d889f5
        adafruit/Adafruit SSD1306@2.5.17
        sparkfun/SparkFun BMI270 Arduino Library@1.0.3
        gin66/FastAccelStepper@2.0.1

    upload_protocol = esptool
    upload_speed = 460800
    monitor_speed = 115200

; ---------------------------------------------------------------------------
; Host tests. `pio test -e native` builds the hardware-free modules for the PC
; and runs test/ against them - today the kinematics against the reference
; table from scripts/kinematics_reference.py. Needs a host C++ compiler (gcc or
; clang on PATH; on Windows e.g. MSYS2's mingw-w64). Not in default_envs, so a
; plain `pio run` still means the device.
;
; build_src_filter is the whole trick: test_build_src pulls src/ into the test
; build, and everything in src/ except the pure modules includes Arduino.h.
; A module joins this list only once it is free of Arduino - that is the line
; Kinematics.h draws in its header.
; ---------------------------------------------------------------------------

[env:native]
    platform = native
    test_build_src = yes
    build_src_filter = -<*> +<Kinematics.cpp> +<JobFormat.cpp> +<Planner.cpp>
    ; UNITY_INCLUDE_DOUBLE: Unity compiles its double assertions out by
    ; default and then fails every one of them with "Double Precision Disabled"
    ; - the kinematics are all doubles.
    build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE

; ---------------------------------------------------------------------------
; Diagnostic environments. Not in default_envs, not built by CI. They exist so
; that the PSRAM question can be re-answered on hardware instead of from
; memory - which is how it came to be answered wrongly in the first place.
;
;   pio run -e psram_quad -t upload   ; reproduces the panic loop
;   pio run -e psram_off  -t upload   ; the configuration used up to v0.1.0
;
; CORE_DEBUG_LEVEL=3 rather than 0 so esp_psram and the WiFi driver say what
; they found: the answer to this question is in their lines, not in ours.
; ---------------------------------------------------------------------------

[env:psram_quad]
    extends = env:seeed_xiao_esp32s3
    ; Quad mode on an octal part. Boots to
    ;   E (253) quad_psram: PSRAM chip is not connected, or wrong PSRAM line mode
    ;   Guru Meditation Error: Core 0 panic'ed (LoadProhibited)
    ; and stays there. Kept because a config that fails on demand is what tells
    ; a mode mismatch from a bad board the next time one is suspected.
    board_build.arduino.memory_type = qio_qspi
    build_flags =
        -DCORE_DEBUG_LEVEL=3

[env:psram_off]
    extends = env:seeed_xiao_esp32s3
    ; No PSRAM at all - what was shipped up to v0.1.0. Still perfectly usable,
    ; and the thing to fall back to if PSRAM is ever suspected of something.
    board_build.arduino.memory_type = qio_qspi
    board_build.extra_flags =
        -DARDUINO_XIAO_ESP32S3
        -DARDUINO_USB_MODE=1
        -DARDUINO_USB_CDC_ON_BOOT=1
        -DARDUINO_RUNNING_CORE=1
        -DARDUINO_EVENT_RUNNING_CORE=1
    build_flags =
        -DCORE_DEBUG_LEVEL=3

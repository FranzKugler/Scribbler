# Runs the host tests - `pio test -e native` - on every push and pull request.
#
# Separate from release.yml on purpose: a test run publishes nothing, so it can
# run for every branch and every pull request, and a red test does not get
# tangled up with a release that half happened.
#
# Today that is the kinematics against the reference table generated by
# scripts/kinematics_reference.py. The runner brings gcc, which the
# development machine may not (see the native environment in platformio.ini).

name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # The table is generated, and committed so the test needs no Python of
      # its own. Recomputing it here catches the one way that can go wrong: a
      # change to the script that was not followed by a regenerate. Compared
      # numerically, not with git diff - see the script's header.
      - name: Reference table is up to date
        run: python scripts/kinematics_reference.py --check

      - name: Host tests
        run: pio test -e native
